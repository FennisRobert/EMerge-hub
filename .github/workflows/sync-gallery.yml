name: Sync Template Gallery

on:
  push:
    branches: [main]
    paths:
      - "Templates/**"
      - "generate_gallery.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate TEMPLATE_GALLERY.md
        run: python3 generate_gallery.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TEMPLATE_GALLERY.md
          if git diff --cached --quiet; then
            echo "TEMPLATE_GALLERY.md already up to date, nothing to commit."
          else
            git commit -m "chore: regenerate TEMPLATE_GALLERY.md [skip ci]"
            git push
          fi
